[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tts_webui_extension.audiocraft_plus"
version = "2.0.8"
description = "An easy-to-use Voice Conversion framework based on VITS"
authors = [
    {name = "lj1995"}
]
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "tts-webui.audiocraft>=1.4.0a2",
    "pytaglib",
    "gradio==4.44.1",
    "huggingface_hub<1.0",
]

[project.urls]
Homepage = "https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI"

[tool.setuptools]
include-package-data = true
packages = ["tts_webui_extension.audiocraft_plus"]

[tool.setuptools.exclude-package-data]
# Explicitly block the recursion
"*" = ["build/**", "cache/**", "dist/**", ".uv_cache/**"]